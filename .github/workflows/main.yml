name: Build TBO Forge 1.21.11

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 9.3.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'

      - name: Extract project ZIP
        shell: bash
        run: |
          mkdir -p extracted
          ZIP=$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)

          if [ -n "$ZIP" ]; then
            unzip -q "$ZIP" -d extracted
            ROOT="extracted"
          else
            ROOT="."
          fi

          BUILD_FILE=$(find "$ROOT" -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Gradle build file not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found project: $PROJECT_DIR"

      - name: Build TBO
        run: gradle --no-daemon clean build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload TBO JAR
        uses: actions/upload-artifact@v4
        with:
          name: TBO-Forge-1.21.11
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          
