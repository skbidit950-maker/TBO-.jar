
name: Build TBO

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find and extract ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -name '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ERROR: No project ZIP found!"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted

      - name: Find Gradle project
        run: |
          FILE=$(find extracted -name build.gradle -o -name build.gradle.kts | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: No Gradle build file found!"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Build
        run: gradle --no-daemon clean build
        working-directory: extracted

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TBO-Forge-JAR
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
          
