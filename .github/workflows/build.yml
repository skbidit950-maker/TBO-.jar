
name: Build TBO Client JAR

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project
        run: |
          unzip -q TBO-Forge-1.21.11-61.2.5-packformat15.zip

      - name: Build TBO
        working-directory: TBO-Forge-1.21.11-61.2.5
        run: gradle --no-daemon clean build

      - name: Upload TBO JAR
        uses: actions/upload-artifact@v4
        with:
          name: TBO-Client-Forge-1.21.11
          path: TBO-Forge-1.21.11-61.2.5/build/libs/*.jar
          if-no-files-found: error
          
